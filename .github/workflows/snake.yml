# Renders the contribution graph as a snake game and publishes the SVGs to
# an "output" branch, which the README reads via raw.githubusercontent.com.
#
# Note: there is deliberately NO actions/checkout step. The svg-only variant
# pulls contribution data straight from the GitHub API and writes to dist/,
# so no working tree is needed. (This mirrors Platane's own workflow.)

name: Snake animation

on:
  schedule:
    - cron: "23 4 * * *" # 04:23 UTC daily
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The dark variant is selected by the ?palette= query string on the
          # output path — there is no separate theme input.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00E5A0&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00E5A0

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
